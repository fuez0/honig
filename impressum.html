<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="site-header"></div>
<section class="section"><div class="wrap narrow prose" id="main"><p class="muted">Wird geladen …</p></div></section>
<div id="site-footer"></div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="common.js?v=8"></script>
<script>
(async function () {
  var H = Honig, e = H.esc, st = await H.loadSettings();
  H.applyChrome(st, 'Impressum');
  document.getElementById('main').innerHTML =
    '<h1>Impressum</h1><p>Informationen gemäß § 5 E-Commerce-Gesetz und Offenlegung gemäß § 25 Mediengesetz</p>' +
    '<p><strong>' + e(st.hof_name) + '</strong><br>Inhaber: ' + e(st.inhaber) + '<br>' + e(st.strasse) + '<br>' + e(st.plz_ort) + '<br>Österreich</p>' +
    '<p>' + (st.telefon ? 'Telefon: ' + e(st.telefon) + '<br>' : '') + (st.email ? 'E-Mail: ' + e(st.email) : '') + '</p>' +
    ((st.impressum_extra || '').trim() ? '<p>' + H.nl(st.impressum_extra) + '</p>' : '') +
    '<p>Blattlinie: Information über die Produkte der Imkerei und Möglichkeit zur Reservierung für die Selbstabholung.</p>' +
    '<p class="small muted">Bildnachweis: Beispielfotos von <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> (Unsplash-Lizenz), sofern nicht durch eigene Fotos ersetzt.</p>';
})();
</script>
</body>
</html>
